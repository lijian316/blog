<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 作品集 · LJ's Playground</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .works-list {
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-bottom: 60px;
    }

    .work-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .work-item:hover {
      background: var(--bg-card);
    }

    .work-item:hover .work-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .work-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .work-title {
      font-size: 15px;
      flex: 1;
    }

    .work-arrow {
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
  </style>
</head>
<body>

<header class="page-top">
  <a href="../index.html" class="back-home"><svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" rx="10" fill="#c96442"/><path d="M8 10 L8 26 L15 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="20" y1="10" x2="26" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/><path d="M20 10 L20 22 Q20 26 16 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>LJ's Playground</a>
</header>

<div class="container">
  <div class="page-header">
    <div class="page-header-tag">✨ AI Works</div>
    <h1>AI 作品集</h1>
    <p>用 AI 生成的网页与工具</p>
  </div>

  <div class="works-list" id="worksList"></div>
</div>

<footer class="footer">
  <p>© 2025 LJ's Playground</p>
</footer>

<script src="data.js"></script>
<script>
  document.getElementById('worksList').innerHTML = WORKS_DATA.map(w => `
    <a href="${w.url}" target="_blank" rel="noopener" class="work-item">
      <div class="work-dot"></div>
      <span class="work-title">${w.title}</span>
      <span class="work-arrow">↗</span>
    </a>
  `).join('');
</script>
</body>
</html>
