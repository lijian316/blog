<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LJ's Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --bg2: #161616;
      --text: #d4d0c8;
      --muted: #555;
      --accent: #7ec8a0;
      --accent2: #5aab82;
      --border: #222;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Illustration ── */
    .illus {
      width: 100%;
      display: block;
      text-align: center;
      min-height: 20px;
    }

    .illus img {
      max-width: 100%;
      max-height: 33vh;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── Site header ── */
    .site-header {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 0;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 48px;
      height: 48px;
      display: block;
    }

    .site-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* ── Nav ── */
    .site-nav {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 24px 0;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .nav-link {
      font-size: 13px;
      color: var(--accent);
      padding: 0 2px;
      transition: color 0.15s;
    }

    .nav-link:hover { color: #fff; }

    .nav-sep {
      color: var(--muted);
      margin: 0 14px;
      font-size: 12px;
    }

    /* ── Main content ── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    /* ── Post list ── */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .post-item {
      display: flex;
      align-items: baseline;
      gap: 24px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.15s;
      cursor: pointer;
    }

    .post-item:first-child { border-top: 1px solid var(--border); }

    .post-item:hover .post-title {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-date {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .post-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      transition: color 0.15s;
    }

    /* ── Nav active ── */
    .nav-link.active { color: #fff; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── About section ── */
    .about-section {
      margin-top: 0;
    }

    .about-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.9;
    }

    .about-text a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .site-footer {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<!-- ── Top illustration ── -->
<div class="illus">
  <img id="hero-img" src="" alt="">
</div>

<script>
  const _images = /* GALLERY_IMAGES_START */ ["24278850-child-6902674.png"] /* GALLERY_IMAGES_END */;
  if (_images.length) {
    document.getElementById('hero-img').src = 'gallery/' + _images[Math.floor(Math.random() * _images.length)];
  }

  fetch('blog/articles.json')
    .then(r => r.json())
    .then(articles => {
      document.getElementById('post-list').innerHTML = articles.map(a => `
        <a href="blog/${a.filename}" target="_blank" rel="noopener" class="post-item">
          <span class="post-date">${a.date}</span>
          <span class="post-title">${a.title}</span>
        </a>
      `).join('');
    });

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    el.classList.add('active');
  }
</script>

<!-- ── Site header ── -->
<header class="site-header">
  <div class="site-title">LJ's Playground</div>
</header>

<!-- ── Nav ── -->
<nav class="site-nav">
  <a href="#" class="nav-link active" id="nav-home" onclick="showPage('home', this)">Notes</a>
  <span class="nav-sep">|</span>
  <a href="#" class="nav-link" id="nav-about" onclick="showPage('about', this)">About</a>
</nav>

<!-- ── Main ── -->
<main class="main">

  <div class="page active" id="page-home">
    <div class="post-list" id="post-list"></div>
  </div>

  <div class="page about-section" id="page-about">
    <p class="section-label">About</p>
    <p class="about-text">
      这里是 LJ 的个人空间，记录旅行计划、生活随笔和各种折腾。<br>
      A personal space for travel plans, notes, and experiments.
    </p>
  </div>

</main>

<!-- ── Footer ── -->
<footer class="site-footer">
  <span>© 2026 LJ's Playground</span>
</footer>

</body>
</html>
