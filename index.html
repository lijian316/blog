<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LJ's Playground</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --bg2: #161616;
      --text: #d4d0c8;
      --muted: #555;
      --accent: #7ec8a0;
      --accent2: #5aab82;
      --border: #222;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Illustration ── */
    .illus {
      width: 100%;
      display: block;
      text-align: center;
      min-height: 20px;
    }

    .illus img {
      max-width: 100%;
      max-height: 33vh;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── Site header ── */
    .site-header {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 0;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 48px;
      height: 48px;
      display: block;
    }

    .site-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* ── Nav ── */
    .site-nav {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 24px 0;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .nav-link {
      font-size: 13px;
      color: var(--accent);
      padding: 0 2px;
      transition: color 0.15s;
    }

    .nav-link:hover { color: #fff; }

    .nav-sep {
      color: var(--muted);
      margin: 0 14px;
      font-size: 12px;
    }

    /* ── Main content ── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    /* ── Post list ── */
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .post-item {
      display: flex;
      align-items: baseline;
      gap: 24px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.15s;
      cursor: pointer;
    }

    .post-item:first-child { border-top: 1px solid var(--border); }

    .post-item:hover .post-title {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .post-date {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .post-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      transition: color 0.15s;
    }

    /* ── Nav active ── */
    .nav-link.active { color: #fff; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Links list ── */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .link-item {
      display: flex;
      align-items: baseline;
      gap: 24px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.15s;
      cursor: pointer;
    }

    .link-item:first-child { border-top: 1px solid var(--border); }

    .link-item:hover .link-title {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-title {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
      transition: color 0.15s;
    }

    .link-host {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .link-pin-sep {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 18px 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .link-item.pinned .link-title { color: #fff; }
    .link-item.pinned .link-host  { color: var(--accent2); }

    /* ── About section ── */
    .about-section {
      margin-top: 0;
    }

    .about-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.9;
    }

    .about-text a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    .site-footer {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Repo browser ── */
    .repo-crumb {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      word-break: break-all;
    }
    .repo-crumb a { color: var(--accent); }
    .repo-crumb a:hover { color: #fff; text-decoration: underline; }

    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .repo-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 13px;
    }
    .repo-card:hover { border-color: var(--accent); background: var(--bg2); }
    .repo-card-icon { font-size: 16px; }
    .repo-card-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .repo-image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-bottom: 24px;
    }
    .repo-image-item {
      display: block;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .repo-image-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .repo-image-item:hover { border-color: var(--accent); }

    .repo-loading, .repo-error, .repo-empty {
      font-size: 13px;
      color: var(--muted);
      padding: 24px 0;
    }
    .repo-error { color: #d47e7e; }

    .repo-back {
      display: inline-block;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .repo-back:hover { color: #fff; }

    .repo-markdown {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
    }
    .repo-markdown h1, .repo-markdown h2, .repo-markdown h3 {
      color: #fff;
      margin: 24px 0 12px;
    }
    .repo-markdown p { margin-bottom: 14px; }
    .repo-markdown code {
      background: var(--bg2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .repo-markdown pre {
      background: var(--bg2);
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .repo-markdown img { max-width: 100%; border-radius: 6px; }
    .repo-markdown a { color: var(--accent); text-decoration: underline; }
    .repo-markdown ul, .repo-markdown ol { padding-left: 22px; margin-bottom: 14px; }
  </style>
</head>
<body>

<!-- ── Top illustration ── -->
<div class="illus">
  <img id="hero-img" src="" alt="">
</div>

<script>
  const _images = /* GALLERY_IMAGES_START */ ["1744869876136____bad-temper____.webp","1744869886290____the-magical-chef____.webp","1744869893597____haircut____.webp","1744869900245____baby-ice-pop____.webp","1744869916977____lose-a-tooth____.webp","1744869924535____wake-up-sleepyhead____.webp","1744869930950____little-balloon-secret____.webp","1764920636991____dopey-fish____.webp","1764920646200____limp-fish____.webp","1764920654757____dazed-fish____.webp","1764920662130____cool-fish____.webp","1764920670170____working-fish____.webp","1764920676819____flat-fish____.webp","24278850-child-6902674.png"] /* GALLERY_IMAGES_END */;
  if (_images.length) {
    document.getElementById('hero-img').src = 'gallery/' + _images[Math.floor(Math.random() * _images.length)];
  }

  function renderList(id, articles) {
    document.getElementById(id).innerHTML = articles.map(a => `
      <a href="blog/${a.filename}" target="_blank" rel="noopener" class="post-item">
        <span class="post-date">${a.date}</span>
        <span class="post-title">${a.title}</span>
      </a>
    `).join('');
  }

  fetch('blog/articles.json').then(r => r.json()).then(a => renderList('post-list', a));
  fetch('blog/daily.json').then(r => r.json()).then(a => renderList('daily-list', a));

  const _links = [
    { title: "科技爱好者周刊", url: "https://www.ruanyifeng.com/blog/weekly/", pinned: true },
    { title: "中国卷烟博物馆", url: "https://www.ciggies.app/" },
    { title: "LINUX DO", url: "https://linux.do/" },
    { title: "Passport Index", url: "https://www.passportindex.org/" },
  ];
  document.addEventListener('DOMContentLoaded', () => {
    const pinned = _links.filter(l => l.pinned);
    const rest   = _links.filter(l => !l.pinned);
    const renderLink = (l) => `
      <a href="${l.url}" target="_blank" rel="noopener" class="link-item${l.pinned ? ' pinned' : ''}">
        <span class="link-host">${new URL(l.url).hostname}</span>
        <span class="link-title">${l.title}</span>
      </a>`;
    let html = '';
    if (pinned.length) {
      html += pinned.map(renderLink).join('');
      if (rest.length) html += `<div class="link-pin-sep">more</div>`;
    }
    html += rest.map(renderLink).join('');
    document.getElementById('link-list').innerHTML = html;
  });

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    el.classList.add('active');
  }

  // ── 仓库导航：每一项对应一个公开的 GitHub 仓库，点击后直接读取该仓库内容 ──
  // 加新仓库只需要在这里加一行，label 是标签显示文字，repo 是仓库名
  const REPO_NAV = [];

  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.querySelector('.site-nav');
    const main = document.querySelector('.main');
    const navAbout = document.getElementById('nav-about');
    const pageAbout = document.getElementById('page-about');

    REPO_NAV.forEach((cfg, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.className = 'nav-sep';
        sep.textContent = '|';
        nav.insertBefore(sep, navAbout);
      }

      const a = document.createElement('a');
      a.href = '#';
      a.className = 'nav-link';
      a.id = 'nav-' + cfg.id;
      a.textContent = cfg.label;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        showPage(cfg.id, this);
        loadRepoTab(cfg);
      });
      nav.insertBefore(a, navAbout);

      const page = document.createElement('div');
      page.className = 'page';
      page.id = 'page-' + cfg.id;
      page.innerHTML = `<div class="repo-browser" id="repo-${cfg.id}"></div>`;
      main.insertBefore(page, pageAbout);
    });

    if (REPO_NAV.length) {
      const trailingSep = document.createElement('span');
      trailingSep.className = 'nav-sep';
      trailingSep.textContent = '|';
      nav.insertBefore(trailingSep, navAbout);
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="assets/js/repo-browser.js"></script>

<!-- ── Site header ── -->
<header class="site-header">
  <div class="site-title">LJ's Playground</div>
</header>

<!-- ── Nav ── -->
<nav class="site-nav">
  <a href="#" class="nav-link active" id="nav-home" onclick="showPage('home', this)">笔记</a>
  <span class="nav-sep">|</span>
  <a href="#" class="nav-link" id="nav-daily" onclick="showPage('daily', this)">日常</a>
  <span class="nav-sep">|</span>
  <a href="#" class="nav-link" id="nav-links" onclick="showPage('links', this)">链接</a>
  <span class="nav-sep">|</span>
  <a href="#" class="nav-link" id="nav-about" onclick="showPage('about', this)">关于</a>
</nav>

<!-- ── Main ── -->
<main class="main">

  <div class="page active" id="page-home">
    <div class="post-list" id="post-list"></div>
  </div>

  <div class="page" id="page-daily">
    <div class="post-list" id="daily-list"></div>
  </div>

  <div class="page" id="page-links">
    <div class="link-list" id="link-list"></div>
  </div>

  <div class="page about-section" id="page-about">
    <p class="about-text">
      心若至此 纵马人间。<img src="assets/images/2402.gif" alt="" style="height:100px;width:auto;vertical-align:middle;margin-left:8px;">
    </p>
  </div>

</main>

<!-- ── Footer ── -->
<footer class="site-footer">
  <span>© 2026 LJ's Playground</span>
</footer>

</body>
</html>
